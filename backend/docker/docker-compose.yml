name: face-attendance

services:
  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: face_attendance_api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ../:/app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:17
    container_name: face_attendance_postgres
    env_file:
      - .env.docker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d face_attendance"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  redis:
    image: redis:8
    container_name: face_attendance_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: face_attendance_minio
    environment:
      MINIO_ROOT_USER: moragon
      MINIO_ROOT_PASSWORD: moragon1234
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
